model:
  name: Qwen/Qwen2.5-0.5B-Instruct

quantization:
  load_in_4bit: true
  quant_type: nf4
  compute_dtype: bfloat16
  double_quant: true

training:
  output_dir: data/checkpoints/africa-lmm-qlora
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

dataset:
  path: data/datasets/africa_lmm_train.jsonl
