services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: africa-lmm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: africa-lmm:dev
    container_name: africa-lmm-api
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      QDRANT_HOST: host.docker.internal
      QDRANT_PORT: "6333"
      DATABASE_URL: postgresql+psycopg://africa_lmm:africa_lmm_dev_2026@host.docker.internal:5432/africa_lmm
    env_file:
      - .env

volumes:
  qdrant_data:
